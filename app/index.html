<!doctype html>
<html lang="fr" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a3326" />
    <meta
      name="description"
      content="Gachapuff : ouvre des boosters, collectionne les puffs JNR, contemple les plus rares."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Gachapuff</title>
    <style>
      /* Static splash, painted before any script runs; React replaces it. */
      html {
        background: #0f4a37;
      }
      body {
        margin: 0;
      }
      .boot-splash {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        color: #f2e8d5;
        font:
          700 2.5rem/1 'Courier New',
          monospace;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-shadow:
          3px 3px 0 #d6312b,
          5px 5px 0 #121212;
      }
      .boot-splash span {
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash"><span>Gachapuff</span></div>
    </div>
    <noscript>Gachapuff a besoin de JavaScript pour ouvrir des boosters.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
