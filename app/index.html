<!doctype html>
<html lang="fr" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12062a" />
    <meta
      name="description"
      content="Gachapuff : ouvre des boosters, collectionne les puffs JNR, contemple les plus rares."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Gachapuff</title>
    <style>
      /* Static splash, painted before any script runs; React replaces it. */
      html {
        background: linear-gradient(
          180deg,
          #12062a 0%,
          #1c0a40 30%,
          #34106a 52%,
          #6b1b86 68%,
          #c02f82 80%,
          #ff7a62 92%,
          #ffc56a 100%
        );
        min-height: 100%;
      }
      body {
        margin: 0;
      }
      .boot-splash {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        color: #fff;
        font:
          900 2.75rem/1 'Arial Black',
          Impact,
          sans-serif;
        letter-spacing: 0;
        text-transform: lowercase;
        text-shadow:
          -2px -2px 0 #160a2b,
          2px -2px 0 #160a2b,
          -2px 2px 0 #160a2b,
          2px 2px 0 #160a2b,
          5px 5px 0 #ff2d87,
          8px 8px 0 #160a2b;
      }
      .boot-splash span {
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash"><span>Gachapuff</span></div>
    </div>
    <noscript>Gachapuff a besoin de JavaScript pour ouvrir des boosters.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
